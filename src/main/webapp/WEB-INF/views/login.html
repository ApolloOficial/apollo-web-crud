<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../docs/css/login/login.css">
</head>
<body>
<main class="tela">

  <section class="banner">
    <div class="logo">
      <img class="logo-texto" src="../../docs/img/logo/Union.png" alt="Apollo">
      <img class="logo-seta" src="../../docs/img/logo/Group 18.png" alt="" aria-hidden="true">
    </div>
    <h2>Cadastro, monitoramento, gestão e muito mais</h2>
    <p class="legal"><a href="#">Termos de serviço</a> / <a href="#">políticas de privacidade</a></p>
  </section>

  <section class="painel">
    <div class="form-wrap">
      <h1 class="titulo">Bem vindo</h1>
      <p class="sub" id="sub-areas">Selecione sua área para efetuar o login</p>

      <div class="areas" role="radiogroup" aria-labelledby="sub-areas">
        <button type="button" class="area" role="radio" data-area="gerente"  aria-checked="true">Gerente</button>
        <button type="button" class="area" role="radio" data-area="tecnico"  aria-checked="false" tabindex="-1">Técnico</button>
        <button type="button" class="area" role="radio" data-area="operador" aria-checked="false" tabindex="-1">Operador</button>
      </div>

      <form id="form-login" action="login" method="post" novalidate>
        <input type="hidden" name="area" id="area" value="gerente">

        <input class="campo" type="email" name="email" placeholder="Email" autocomplete="username" aria-label="Email" required>

        <div class="campo-wrap">
          <input class="campo" type="password" name="senha" placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
          <button type="button" class="ver-senha" id="ver-senha" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path class="riscado" d="m4 4 16 16"/>
            </svg>
          </button>
        </div>
        <p class="aviso" id="aviso-caps" hidden>Caps Lock está ativado</p>

        <a class="esqueci" href="login_esqueci_senha.html">Esqueci a senha</a>

        <button class="entrar" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="entrar-txt">Entrar</span>
        </button>
        <p class="erro" id="erro" role="alert"></p>
      </form>
    </div>
  </section>

</main>

<script src="../../docs/js/login.js"></script>
</body>
</html>
